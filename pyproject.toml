[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docurisk-ai"
version = "0.1.0a0"
description = "English-first document parsing API, designed for evidence-grounded contract intelligence"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.12,<1",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
docling = ["docling>=2.0,<3"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docling_integration: real Docling PDF conversion (requires models)"]
addopts = "-m 'not docling_integration'"
